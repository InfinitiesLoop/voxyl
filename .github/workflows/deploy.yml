# Deploys Voxyl to Cloudflare: the agent relay (a Worker, api.voxyl.xyz) and the web app (Pages,
# voxyl.xyz). Manual only: run it from the Actions tab.
#
# Run from `main` and both are production deploys, relay first so a new app never talks to an
# older relay. Run from any other branch and only the web app deploys, as a preview at
# <branch>.voxyl.pages.dev, which never touches voxyl.xyz or the relay.
#
# One-time setup (see .plans/web-migration.md, "Production (voxyl.xyz)", and .plans/web-tools.md,
# "The relay"). Repository secrets:
#   CLOUDFLARE_ACCOUNT_ID         the account both deploys use.
#   CLOUDFLARE_PAGES_API_TOKEN    Account > Pages > Edit only.
#   CLOUDFLARE_WORKERS_API_TOKEN  the "Edit Cloudflare Workers" template, plus DNS Edit on the
#                                 voxyl.xyz zone (api.voxyl.xyz is created on first deploy).
#   RELAY_TOKEN_SECRET            a long random string; it signs every agent token, so changing
#                                 it cuts off every connected agent. Make one with
#                                 node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
# Each job sees only its own token; nothing else in it can reach the account.

name: Deploy

on:
  workflow_dispatch:

# One deploy per branch at a time; a newer run waits rather than racing the older one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing ships unless the checks are green. Once for both deploys.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  relay:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy the Worker
        run: pnpm --filter @voxyl/relay-worker exec wrangler deploy

      # After the deploy, so the Worker exists. Setting the same value again changes nothing.
      - name: Set the token secret
        env:
          RELAY_TOKEN_SECRET: ${{ secrets.RELAY_TOKEN_SECRET }}
        run: printf '%s' "$RELAY_TOKEN_SECRET" | pnpm --filter @voxyl/relay-worker exec wrangler secret put TOKEN_SECRET

      # The same check an agent's first minutes would run, against the live relay.
      # The first deploy creates the DNS record, which can take a minute to answer: retry.
      - name: Smoke test
        run: |
          for attempt in 1 2 3 4 5 6; do
            node tools/relay-smoke.ts --url https://api.voxyl.xyz && exit 0
            sleep 15
          done
          exit 1

  web:
    needs: [check, relay]
    # The relay job is skipped off main; that must not skip the preview. A failed relay does.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.relay.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @voxyl/web build

      # Wrangler runs straight from the registry, not through cloudflare/wrangler-action, whose
      # own install step would add it to this pnpm workspace's root.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm dlx wrangler@4 pages deploy apps/web/dist
          --project-name=voxyl
          --branch=${{ github.ref_name }}
