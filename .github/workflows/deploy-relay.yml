# Deploys the agent relay (web/apps/relay) to Cloudflare Workers as api.voxyl.xyz. Manual only.
# It always deploys production, so it refuses to run from any branch but main.
#
# One-time setup (see .plans/web-tools.md, "The relay"):
#   1. A Cloudflare API token from the "Edit Cloudflare Workers" template, plus DNS Edit on the
#      voxyl.xyz zone (the custom domain api.voxyl.xyz is created on first deploy). Add it as the
#      repository secret CLOUDFLARE_WORKERS_API_TOKEN. This is not the Pages token.
#   2. CLOUDFLARE_ACCOUNT_ID, the same one the Pages workflow uses.
#   3. RELAY_TOKEN_SECRET: a long random string (node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))").
#      It signs every agent token. Changing it cuts off every connected agent.

name: Deploy relay

on:
  workflow_dispatch:

concurrency:
  group: deploy-relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Nothing ships unless the checks are green.
      - run: pnpm check

      - name: Deploy the Worker
        run: pnpm --filter @voxyl/relay-worker exec wrangler deploy

      # After the deploy, so the Worker exists. Setting the same value again changes nothing.
      - name: Set the token secret
        env:
          RELAY_TOKEN_SECRET: ${{ secrets.RELAY_TOKEN_SECRET }}
        run: printf '%s' "$RELAY_TOKEN_SECRET" | pnpm --filter @voxyl/relay-worker exec wrangler secret put TOKEN_SECRET

      # The same check an agent's first minutes would run, against the live relay.
      # The first deploy creates the DNS record, which can take a minute to answer: retry.
      - name: Smoke test
        run: |
          for attempt in 1 2 3 4 5 6; do
            node tools/relay-smoke.ts --url https://api.voxyl.xyz && exit 0
            sleep 15
          done
          exit 1
